name: CI — safe local-core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: python -m ruff check src tests scripts
      - name: Tests
        run: python -m pytest -q
      - name: Verify frozen vendor integrity
        run: python scripts/verify_vendor_integrity.py
      - name: Check secret and live-trade defaults
        run: python scripts/check_repository_policy.py
