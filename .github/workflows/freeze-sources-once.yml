name: One-time frozen source archive (review branch)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeze-sources-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-source-freeze
  cancel-in-progress: false

jobs:
  frozen-source-archive:
    if: github.repository == 'iitij/Gold-Intelligence-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only provenance validation
        run: |
          python scripts/verify_vendor_integrity.py
          python scripts/freeze_sources.py --dry-run --include-optional
      - name: Initial fixed-commit source import, no execution of vendor code
        run: python scripts/freeze_sources.py --confirm --include-optional
      - name: Initial immutable model-weight revision pin (metadata only)
        run: python scripts/pin_models_once.py --confirm
      - name: Stage evidence in a separate review branch
        shell: bash
        run: |
          set -euo pipefail
          branch="vendor/one-time-frozen-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -f vendor/snapshots/ vendor/SNAPSHOT_MANIFEST.json models/foundation_weights.lock.json
          git commit -m "vendor: one-time immutable snapshots and model revisions"
          git push origin "HEAD:refs/heads/$branch"
          echo "Review branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          echo "Create a Pull Request, review legal/security scope, and remove this workflow after merge." >> "$GITHUB_STEP_SUMMARY"
