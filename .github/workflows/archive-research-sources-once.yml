name: One-time offline research references (review branch)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-research-sources-once.yml']

permissions:
  contents: write

concurrency:
  group: gold-once-research-snapshots
  cancel-in-progress: false

jobs:
  archive-only:
    if: github.repository == 'iitij/Gold-Intelligence-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check one-time fixed SHA and license choices
        run: python scripts/freeze_research_refs_once.py
      - name: Copy source bytes only; never install, import or execute candidates
        run: python scripts/freeze_research_refs_once.py --confirm
      - name: Verify digests and non-executable policy
        run: python scripts/verify_research_refs.py
      - name: Create review branch and retire archive workflow
        shell: bash
        run: |
          set -euo pipefail
          name="vendor/offline-references-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$name"
          git add -f vendor/research_refs/ vendor/RESEARCH_REFS_MANIFEST.json
          git rm .github/workflows/archive-research-sources-once.yml
          git commit -m "vendor: archive immutable untrusted research references, remove one-time importer"
          git push origin "HEAD:refs/heads/$name"
          echo "Offline research review branch: $name" >> "$GITHUB_STEP_SUMMARY"
          echo "DO NOT IMPORT OR EXECUTE archives; review before separate Pull Request." >> "$GITHUB_STEP_SUMMARY"
