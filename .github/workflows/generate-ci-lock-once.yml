name: One-time pinned CI wheel requirements (review branch)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-ci-lock-once.yml'
permissions:
  contents: write
concurrency:
  group: gold-one-time-ci-lock
  cancel-in-progress: false
jobs:
  prepare-lock:
    if: github.repository == 'iitij/Gold-Intelligence-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node24
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 / Node24
        with:
          python-version: '3.11'
      - name: Install one-time approved lock compiler
        run: python -m pip install 'uv==0.10.0'
      - name: Resolve dev/test dependencies once for Python 3.11
        shell: bash
        run: |
          set -euo pipefail
          uv pip compile pyproject.toml \
            --extra dev --python-version 3.11 --generate-hashes \
            --output-file requirements-ci.lock
          test -s requirements-ci.lock
          python -m pip install --dry-run --require-hashes -r requirements-ci.lock
      - name: Create review branch; remove workflow to prohibit silent re-resolution
        shell: bash
        run: |
          set -euo pipefail
          branch="ci/frozen-py311-wheel-lock-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add requirements-ci.lock
          git rm .github/workflows/generate-ci-lock-once.yml
          git commit -m "build: pin Python 3.11 CI dependency graph with hashes; retire resolver"
          git push origin "HEAD:refs/heads/$branch"
          echo "Review immutable lock at branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          echo "Review hashes, run CI, then switch CI installer in a separate PR." >> "$GITHUB_STEP_SUMMARY"
