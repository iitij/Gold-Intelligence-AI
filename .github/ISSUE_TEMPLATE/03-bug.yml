name: Bug report
description: مشكلة قابلة لإعادة الإنتاج
labels: ["type:bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Safety, execution, data-leakage impact
    validations:
      required: true
